<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="졸라맨 스케치를 그리면 바로 3D 포즈 레퍼런스로">
  <title>rkgk to 3D</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M13.5 7l3.5 3.5"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.7 14.7l9.6-9.6a2 2 0 0 1 2.8 0l2.8 2.8a2 2 0 0 1 0 2.8L12 18.6a3 3 0 0 1-2.1.9H8.4a2 2 0 0 1-1.4-.6l-2.3-2.3a2 2 0 0 1 0-2.8z"/><path d="M9 10.5l5.5 5.5"/></symbol>
      <symbol id="i-lasso" viewBox="0 0 24 24"><path d="M7 16.5C4.6 15.3 3 13.3 3 11c0-4 4-7 9-7s9 3 9 7-4 7-9 7c-.9 0-1.8-.1-2.6-.3"/><circle cx="8" cy="17.5" r="1.8"/><path d="M8 19.3c0 1.2-.6 2-1.6 2.7"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l.8 12.2a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L17.5 7"/></symbol>
      <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-9 8.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-joint" viewBox="0 0 24 24"><path d="M5 4l5.5 15 2.2-6.3L19 10.5z"/></symbol>
      <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="9" r="1.8"/><path d="M12 11v4M9.5 13h5M10.5 18l1.5-3 1.5 3"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <section class="pane draw">
      <header class="head">
        <h1>rkgk <span>to 3D</span></h1>
        <p>색마다 다른 인물로 인식해요. 몸통·팔다리를 면으로 칠하면 가장 잘 잡혀요. 가려지는 팔다리도 그려 주세요.</p>
      </header>

      <div id="stage" class="stage"></div>

      <nav class="tools" aria-label="그리기 도구">
        <div class="group">
          <button class="tool on" data-tool="pen" title="펜 (B)"><svg><use href="#i-pen"/></svg></button>
          <button class="tool" data-tool="eraser" title="지우개 (E)"><svg><use href="#i-eraser"/></svg></button>
          <button class="tool" data-tool="lasso" title="라쏘 — 감싸서 옮기기, Delete로 지우기 (L)"><svg><use href="#i-lasso"/></svg></button>
          <button class="tool" data-tool="joint" title="관절 — 인식된 관절 점 옮기기 (V)"><svg><use href="#i-joint"/></svg></button>
        </div>
        <div class="group" id="swatches"></div>
        <div class="group recog">
          <div class="seg" role="group" aria-label="인식 방식">
            <button id="mode-auto" class="pill" title="그리는 동안 바로 인식 (R로 전환)">자동</button>
            <button id="mode-manual" class="pill" title="인식 버튼을 누를 때만 인식 (R로 전환)">수동</button>
          </div>
          <button id="recognize" class="pill" title="지금 인식 (Enter)" hidden>인식</button>
        </div>
        <div class="group size">
          <input id="size" type="range" min="1" max="60" value="8" aria-label="굵기">
          <output id="size-val">8</output>
        </div>
        <div class="group">
          <button id="undo" title="되돌리기 (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
          <button id="redo" title="다시 하기 (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button>
          <button id="guides" class="on" title="인식된 관절 보기"><svg><use href="#i-eye"/></svg></button>
          <button id="clear" title="모두 지우기"><svg><use href="#i-trash"/></svg></button>
        </div>
      </nav>
    </section>

    <section class="pane view">
      <div id="viewport"></div>
      <p id="empty" class="empty">그림을 그리면<br>바로 3D 포즈로 바뀝니다</p>

      <div class="top">
        <div id="chips" class="chips"></div>
        <span id="status" class="status"></span>
      </div>
      <div class="seg modes" role="group" aria-label="3D 편집">
        <button class="pill on" data-mode="layout" title="배치: 몸통·화살표를 끌어 옮기고, 발밑 고리로 돌리기">배치</button>
        <button class="pill" data-mode="joint" title="관절: 마름모를 끌어 관절 옮기기 (주황은 불확실한 관절)">관절</button>
        <button class="pill" data-mode="light" title="조명: 빛을 끌어 방향 바꾸기, 눌러서 켜고 끄기">조명</button>
      </div>

      <aside id="card" class="card" hidden>
        <div class="card-head">
          <span class="dot" id="card-dot"></span>
          <strong id="card-title"></strong>
          <button id="deselect" class="ghost" title="닫기 (Esc)"><svg><use href="#i-close"/></svg></button>
        </div>
        <p id="card-state" class="muted"></p>
        <div class="field">
          <span class="label">해석</span>
          <div class="stepper">
            <button id="prev-cand" class="ghost" aria-label="이전 해석"><svg><use href="#i-prev"/></svg></button>
            <output id="cand-label"></output>
            <button id="next-cand" class="ghost" aria-label="다음 해석"><svg><use href="#i-next"/></svg></button>
          </div>
        </div>
        <div class="field">
          <span class="label">체형</span>
          <div class="pills">
            <span class="seg">
              <button data-sex="male" class="pill">남</button>
              <button data-sex="female" class="pill">여</button>
            </span>
            <span class="seg">
              <button data-style="anime" class="pill">애니</button>
              <button data-style="real" class="pill">실사</button>
            </span>
          </div>
        </div>
        <div class="field">
          <span class="label">방향</span>
          <button data-flip="body" class="pill">몸 앞뒤 반전</button>
        </div>
        <div class="field">
          <span class="label">팔다리 앞뒤</span>
          <div class="pills">
            <button data-flip="la" class="pill" title="인형의 밝은 쪽 팔"><span class="side light"></span>왼팔</button>
            <button data-flip="ra" class="pill" title="인형의 어두운 쪽 팔"><span class="side dark"></span>오른팔</button>
            <button data-flip="ll" class="pill" title="인형의 밝은 쪽 다리"><span class="side light"></span>왼다리</button>
            <button data-flip="rl" class="pill" title="인형의 어두운 쪽 다리"><span class="side dark"></span>오른다리</button>
          </div>
        </div>
        <div class="field">
          <span class="label">순서</span>
          <div class="pills">
            <button id="to-front" class="pill">앞으로</button>
            <button id="to-back" class="pill">뒤로</button>
          </div>
        </div>
        <div class="field">
          <span class="label">크기 <output id="scale-val">1.00</output></span>
          <input id="scale" type="range" min="0.5" max="1.5" step="0.01" value="1">
        </div>
        <div class="field">
          <span class="label">회전 <output id="yaw-val">0°</output></span>
          <input id="yaw" type="range" min="-180" max="180" step="1" value="0">
        </div>
        <div class="field">
          <span class="label">앞뒤 기울기 <output id="pitch-val">0°</output></span>
          <input id="pitch" type="range" min="-90" max="90" step="1" value="0" title="+ 앞으로 숙이기, − 뒤로 젖히기">
        </div>
        <div class="field">
          <span class="label">옆 기울기 <output id="roll-val">0°</output></span>
          <input id="roll" type="range" min="-90" max="90" step="1" value="0" title="+ 인형의 오른쪽으로, − 왼쪽으로">
        </div>
        <div class="pills">
          <button id="reset-pos" class="ghost text">배치 되돌리기</button>
          <button id="reset-joints" class="ghost text">관절 되돌리기</button>
        </div>
      </aside>

      <div class="viewbar">
        <label class="fov">화각 <input id="fov" type="range" min="10" max="90" step="1" value="35"> <output id="fov-val">35°</output></label>
        <div class="group">
          <button id="frame" title="정면으로 맞추기"><svg><use href="#i-focus"/></svg></button>
          <button id="export-png" title="PNG 저장" disabled><svg><use href="#i-image"/></svg></button>
          <button id="export-zip" title="묶음 내보내기 (BVH + PNG + 카메라)" disabled><svg><use href="#i-download"/></svg></button>
          <details class="more">
            <summary title="설정"><svg><use href="#i-more"/></svg></summary>
            <div class="menu">
              <label>인식 모델
                <select id="model">
                  <option value="full">기본</option>
                  <option value="heavy">정밀 (느림)</option>
                </select>
              </label>
              <label>신뢰도 기준 <output id="threshold-val">0.50</output>
                <input id="threshold" type="range" min="0" max="1" step="0.05" value="0.5">
              </label>
              <label class="check"><input id="light-key" type="checkbox" checked> 주 광원</label>
              <label class="check"><input id="light-fill" type="checkbox" checked> 보조 광원</label>
              <label class="check"><input id="grid" type="checkbox" checked> 바닥 격자</label>
              <div><span class="label">인식 장치</span> <output id="device">준비 중</output></div>
              <div>
                <span class="label">카메라 수치</span>
                <pre id="camera-info"></pre>
              </div>
            </div>
          </details>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
